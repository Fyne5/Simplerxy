### Set show log: yes or no
logShow = yes

### Set manually port
#Set to server's IP if it hosted on other site.
listenAddress = :3979

### Set timeout
readTimeout = 60s
writeTimeout = 60s
idleTimeout = 300s
clientTimeout = 120s

#### DNS
dnsFallback = 208.67.222.222
dnsIP = 8.8.8.8
dnsDOH = https://1.1.1.1/dns-query
dnsDOT = 1.1.1.1
dnsCache = yes
dnsCacheSize = 1MB
dnsCacheExp = 60s

### Allowlist IP client
clientAllowlist = 127.0.0.1;192.168.0.0/16;::1

### Allow reverse access to private IP from outside of proxy: yes or no
# LAN < Proxy < Outside (do not allow this, set no)
allowPrivateIP = no
