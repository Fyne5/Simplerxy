### Set show log: yes or no
logShow = yes

### Set manually port (IPv4/6)
listenAddress = :3979

### Set timeout
readTimeout = 60s
writeTimeout = 60s
idleTimeout = 300s
clientTimeout = 120s

### DNS
dnsForceIP = dns.google[8.8.8.8|8.8.4.4]; one.one.one.one[1.1.1.1|1.0.0.1]; cloudflare-dns.com[104.16.249.249|104.16.248.249]; dns.quad9.net[9.9.9.9|149.112.112.112]
dnsFallback = 208.67.222.222
dnsIP = 8.8.4.4
dnsDOH = https://1.1.1.1/dns-query
dnsDOT = dns.quad9.net
dnsCache = yes
dnsCacheSize = 1MB
dnsCacheExp = 60s
dnsLocalDomain = .coca; .local; .lan

### Allowlist IP client
clientAllowlist = ::1;127.0.0.1;192.168.0.0/16

### Allow specific private destination CIDRs when allowPrivateIP = no
allowPrivateDest = 192.168.0.0/16;10.10.0.0/16

### Allow access to private IP: yes or no
# Don't set yes unless debug/test
allowPrivateIP = no
