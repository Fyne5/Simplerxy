###Up
#clear;docker-compose up -d --remove-orphans;docker-compose logs -f

services:
  simplerxy:
    image: tquang/simplerxy:1.0.1
    container_name: simplerxy
    environment:
      TZ: "Asia/Saigon"
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.conf:/app/simplerxy/config.conf:ro