### Set show log: yes or no
logshow = yes

### Set manually port
listenAddress = 0.0.0.0:3979

### Set timeout
# Transfer client's data > proxy
readTimeout = 10s
# Transfer proxy's data > client
writeTimeout = 10s
# Close connections if has nothing happend
idleTimeout = 10s
# Close connections if client is over time
clientTimeout = 60s

#### DNS
dnsFallback = 208.67.222.222
dnsIP = 8.8.8.8
dnsDOH = https://cloudflare-dns.com/dns-query
dnsDOT = 1.1.1.1
dnsCache = yes
dnsCacheSize = 1MB
dnsCacheExp = 60s

### Allowlist IP client
clientAllowlist = 127.0.0.1; 192.168.0.0/16; ::1

### Allow reverse access to private IP from outside of proxy: yes or no
# LAN < Proxy < Outside (do not allow this, set no)
allowPrivateIP = no
