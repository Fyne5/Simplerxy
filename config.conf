### Set show log: yes or no
logShow = yes

### Set manually port (IPv4/6)
listenAddress = :3979

### Set timeout
readTimeout = 60s
writeTimeout = 60s
idleTimeout = 300s
clientTimeout = 120s

### DNS
dnsCache = yes
dnsCacheSize = 1MB
dnsCacheExp = 60s

dnsFallback = 208.67.222.222
dnsIP = 9.9.9.10
dnsDOH = https://dns.google/dns-query
dnsDOT = unfiltered.adguard-dns.com

# If ISP fake IPs of domains (DoH/DoT), force use these IPs below
dnsForceIP = dns.google[8.8.8.8|8.8.4.4]; one.one.one.one[1.1.1.1|1.0.0.1]; cloudflare-dns.com[104.16.249.249|104.16.248.249]; dns.quad9.net[9.9.9.9|149.112.112.112]; unfiltered.adguard-dns.com[94.140.14.140|94.140.14.141]

# List domains which resolved by strictly DNS IP declared in `dnsLocalResolver`
dnsLocalDomain = .coca; .local; .lan
# dnsLocalResolver = 192.168.20.12; 192.168.20.251
dnsLocalResolver = 192.168.20.12

### Allowlist IP client
clientAllowlist = ::1;127.0.0.1;192.168.0.0/16

### Allow specific private destination CIDRs when allowPrivateIP = no
allowPrivateDest = 192.168.0.0/16;10.10.0.0/16

### Allow access to private IP: yes or no
# Don't set yes unless debug/test
allowPrivateIP = no
